<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rent Requirement Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      padding: 36px 32px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #6b7280;
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .optional {
      font-weight: 400;
      color: #9ca3af;
      text-transform: none;
      letter-spacing: 0;
      font-size: 0.75rem;
      margin-left: 4px;
    }

    .input-wrap {
      position: relative;
    }

    .input-prefix {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #6b7280;
      font-size: 1rem;
      pointer-events: none;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px 12px 10px 28px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      color: #111827;
      outline: none;
      transition: border-color 0.15s;
      -moz-appearance: textfield;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

    input[type="number"]:focus {
      border-color: #4f46e5;
    }

    .multiplier-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .multiplier-btn {
      padding: 10px 0;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      font-size: 0.9375rem;
      font-weight: 600;
      color: #374151;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      text-align: center;
    }

    .multiplier-btn:hover {
      border-color: #4f46e5;
      color: #4f46e5;
    }

    .multiplier-btn.active {
      border-color: #4f46e5;
      background: #4f46e5;
      color: #fff;
    }

    .divider {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 28px 0;
    }

    .result-box {
      border-radius: 12px;
      padding: 20px;
      margin-top: 8px;
    }

    .result-box.hidden { display: none; }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.9375rem;
      color: #374151;
      margin-bottom: 10px;
    }

    .result-row:last-child { margin-bottom: 0; }

    .result-label { font-weight: 500; }

    .result-value {
      font-weight: 700;
      font-size: 1.0625rem;
    }

    .result-divider {
      border: none;
      border-top: 1px solid rgba(0,0,0,0.08);
      margin: 12px 0;
    }

    .verdict {
      border-radius: 12px;
      padding: 16px 20px;
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .verdict-icon { font-size: 1.5rem; flex-shrink: 0; }

    .verdict-text { flex: 1; }

    .verdict-title {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 2px;
    }

    .verdict-detail {
      font-size: 0.875rem;
    }

    .verdict.over {
      background: #ecfdf5;
      border: 1.5px solid #6ee7b7;
    }

    .verdict.over .verdict-title { color: #065f46; }
    .verdict.over .verdict-detail { color: #047857; }

    .verdict.under {
      background: #fff1f2;
      border: 1.5px solid #fca5a5;
    }

    .verdict.under .verdict-title { color: #991b1b; }
    .verdict.under .verdict-detail { color: #b91c1c; }

    .verdict.exact {
      background: #eff6ff;
      border: 1.5px solid #93c5fd;
    }

    .verdict.exact .verdict-title { color: #1e3a8a; }
    .verdict.exact .verdict-detail { color: #1d4ed8; }

    .result-box { background: #f9fafb; border: 1px solid #e5e7eb; }

    footer {
      margin-top: 28px;
      font-size: 0.75rem;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Rent Requirement Calculator</h1>
    <p class="subtitle">Find out if your income meets the landlord's requirement.</p>

    <div class="field">
      <label>Monthly Rent</label>
      <div class="input-wrap">
        <span class="input-prefix">$</span>
        <input type="number" id="rent" placeholder="2,500" min="0" step="1" />
      </div>
    </div>

    <div class="field">
      <label>Income Multiplier</label>
      <div class="multiplier-grid">
        <button class="multiplier-btn" data-value="2.5">2.5×</button>
        <button class="multiplier-btn active" data-value="3">3×</button>
        <button class="multiplier-btn" data-value="3.5">3.5×</button>
        <button class="multiplier-btn" data-value="4">4×</button>
      </div>
    </div>

    <hr class="divider" />

    <div class="field">
      <label>Person 1 — Gross Annual Income</label>
      <div class="input-wrap">
        <span class="input-prefix">$</span>
        <input type="number" id="income1" placeholder="60,000" min="0" step="1" />
      </div>
    </div>

    <div class="field">
      <label>Person 2 — Gross Annual Income <span class="optional">optional</span></label>
      <div class="input-wrap">
        <span class="input-prefix">$</span>
        <input type="number" id="income2" placeholder="0" min="0" step="1" />
      </div>
    </div>

    <div id="result-box" class="result-box hidden">
      <div class="result-row">
        <span class="result-label">Monthly rent</span>
        <span class="result-value" id="r-rent">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">Required annual income (<span id="r-mult-label">3×</span>)</span>
        <span class="result-value" id="r-required">—</span>
      </div>
      <hr class="result-divider" />
      <div class="result-row">
        <span class="result-label">Person 1 income</span>
        <span class="result-value" id="r-p1">—</span>
      </div>
      <div id="r-p2-row" class="result-row" style="display:none;">
        <span class="result-label">Person 2 income</span>
        <span class="result-value" id="r-p2">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">Combined income</span>
        <span class="result-value" id="r-combined">—</span>
      </div>
      <div id="verdict" class="verdict"></div>
    </div>

    <footer>Numbers shown are for estimation only.</footer>
  </div>

  <script>
    const fmt = (n) => '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });

    let multiplier = 3;

    document.querySelectorAll('.multiplier-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.multiplier-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        multiplier = parseFloat(btn.dataset.value);
        calculate();
      });
    });

    ['rent', 'income1', 'income2'].forEach(id => {
      document.getElementById(id).addEventListener('input', calculate);
    });

    function calculate() {
      const rent = parseFloat(document.getElementById('rent').value) || 0;
      const income1 = parseFloat(document.getElementById('income1').value) || 0;
      const income2 = parseFloat(document.getElementById('income2').value) || 0;

      const box = document.getElementById('result-box');

      if (rent <= 0 || income1 <= 0) {
        box.classList.add('hidden');
        return;
      }

      box.classList.remove('hidden');

      const required = rent * 12 * multiplier;
      const combined = income1 + income2;
      const diff = combined - required;

      document.getElementById('r-rent').textContent = fmt(rent) + '/mo';
      document.getElementById('r-mult-label').textContent = multiplier + '×';
      document.getElementById('r-required').textContent = fmt(required) + '/yr';
      document.getElementById('r-p1').textContent = fmt(income1) + '/yr';
      document.getElementById('r-combined').textContent = fmt(combined) + '/yr';

      const p2Row = document.getElementById('r-p2-row');
      if (income2 > 0) {
        document.getElementById('r-p2').textContent = fmt(income2) + '/yr';
        p2Row.style.display = 'flex';
      } else {
        p2Row.style.display = 'none';
      }

      const verdict = document.getElementById('verdict');
      if (diff > 0) {
        verdict.className = 'verdict over';
        verdict.innerHTML = `
          <span class="verdict-icon">✅</span>
          <div class="verdict-text">
            <div class="verdict-title">Income qualifies</div>
            <div class="verdict-detail">${fmt(diff)} above the requirement</div>
          </div>`;
      } else if (diff < 0) {
        verdict.className = 'verdict under';
        verdict.innerHTML = `
          <span class="verdict-icon">❌</span>
          <div class="verdict-text">
            <div class="verdict-title">Income falls short</div>
            <div class="verdict-detail">${fmt(Math.abs(diff))} below the requirement</div>
          </div>`;
      } else {
        verdict.className = 'verdict exact';
        verdict.innerHTML = `
          <span class="verdict-icon">✔️</span>
          <div class="verdict-text">
            <div class="verdict-title">Exactly meets the requirement</div>
            <div class="verdict-detail">Combined income matches perfectly</div>
          </div>`;
      }
    }
  </script>
</body>
</html>
